<!doctype html>
<html lang="en">

<!-- Standalone test page for twin/interior.js (served only by test/mock-research.mjs): the same renderer, lights, bloom

<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<style>
  :root { --ui: "Inter Ody", Inter, ui-sans-serif, system-ui, sans-serif; --holo: #3BD8FF; --ink: #EEEAF5; --muted: #ABA3C0; color-scheme: dark; }
  @font-face { font-family: "Inter Ody"; src: local("Inter Variable"), local("Inter"), url("/fonts/InterVariable.ttf") format("truetype"); font-weight: 100 900; }
  html, body { margin: 0; height: 100%; background: #04070b; color: var(--ink); font: 14px/1.4 var(--ui); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #view { width: 100%; height: 100%; display: block; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .tag { position: relative; width: 0; height: 0; }
  .tag i { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .tag b { position: absolute; left: 0; bottom: 0; width: 34px; height: 1px; background: currentColor; opacity: .7; transform-origin: 0 0; transform: rotate(-38deg); }
  .tag span { position: absolute; left: 26px; bottom: 20px; white-space: nowrap; font: 600 12.5px/1 var(--ui); max-width: 30ch; overflow: hidden; text-overflow: ellipsis;
    color: #fff; background: rgba(12,16,22,.78); border: 1px solid color-mix(in srgb, currentColor 55%, transparent); padding: 6px 9px 6px 8px; border-radius: 8px; }
  .tag.layer { color: #8FEFFF; } .tag.layer b { width: 60px; transform: rotate(0deg); } .tag.layer span { left: 64px; bottom: -11px; }
  body:not(.holo) .tag.layer { color: #d8dce4; }
  .panel { position: fixed; left: 16px; top: 16px; width: 300px; max-height: calc(100% - 32px); overflow: auto; background: rgba(12,16,22,.82);
    border: 1px solid #2e2742; border-radius: 14px; padding: 14px 16px; box-sizing: border-box; }
  .panel h1 { margin: 0; font-size: 18px; font-weight: 650; }
  .panel .sub { color: var(--muted); margin: 2px 0 10px; }
  .row { display: flex; gap: 6px; margin: 10px 0; }
  .row button { flex: 1; font: 600 12.5px var(--ui); color: var(--ink); background: #1b1629; border: 1px solid #2e2742; border-radius: 8px; padding: 7px 0; cursor: pointer; }
  .row button[aria-pressed="true"] { background: rgba(59,216,255,.18); border-color: var(--holo); color: #fff; }
  ol { list-style: none; margin: 0; padding: 0; }
  ol > li > strong { display: block; margin: 10px 0 3px; font-size: 12px; color: var(--holo); letter-spacing: .02em; }
  ol button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: 13px var(--ui); padding: 3px 6px; border-radius: 6px; cursor: pointer; }
  ol button:hover, ol button:focus-visible { background: rgba(59,216,255,.14); outline: none; }
  .src { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .src a { color: var(--holo); }
  #tip { position: fixed; pointer-events: none; background: rgba(12,16,22,.92); border: 1px solid var(--holo); border-radius: 8px; padding: 7px 10px; max-width: 34ch; font-size: 12.5px; }
  #tip strong { display: block; font-size: 13px; } #tip em { display: block; font-style: normal; color: var(--muted); font-size: 11.5px; }

<body class="holo">
<div id="stage"><canvas id="view"></canvas><div id="labels"></div></div>
<aside class="panel">
  <h1 id="name">Loading</h1>
  <div class="sub" id="guess"></div>
  <div class="row">
    <button type="button" id="b-holo" aria-pressed="true">Hologram</button>
    <button type="button" id="b-xray" aria-pressed="false">X-ray</button>
    <button type="button" id="b-explode" aria-pressed="false">Explode</button>
  </div>
  <ol id="parts"></ol>
  <div class="src" id="src"></div>
</aside>
<div id="tip" role="tooltip" hidden><strong></strong><span></span><em></em></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { clock, holoMaterial, edgeMaterial, makeProjectorFloor, easeInOut } from '/twin/holo.js';
import { buildScan, disposeScan } from '/twin/scan.js';
import { buildInterior, explodeInterior, setInteriorXray, setInteriorLook, pickInterior, partInfo, highlightInterior, interiorItems, interiorBox, disposeInterior } from '/twin/interior.js';

const $ = id => document.getElementById(id);
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 1, 5000);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true;
const labels = new CSS2DRenderer({ element: $('labels') });
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.45;
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(-80, 220, 140); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); Object.assign(key.shadow.camera, { left: -200, right: 200, top: 200, bottom: -200, near: 10, far: 800 });
scene.add(key, new THREE.HemisphereLight(0xdfe8ff, 0x202024, 0.6));
const realFloor = new THREE.Group();
{ const pool = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.MeshBasicMaterial({ color: 0x26262a })); pool.rotation.x = -Math.PI / 2; pool.position.y = -0.05;
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.ShadowMaterial({ opacity: 0.45 })); sh.rotation.x = -Math.PI / 2; sh.receiveShadow = true; realFloor.add(pool, sh); }
const holoFloor = makeProjectorFloor(); scene.add(realFloor, holoFloor);
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.9, 0.55, 0.1); composer.addPass(bloom); composer.addPass(new OutputPass());
const twin = new THREE.Group(); scene.add(twin);

// the app's decorate()/applyLook(), unchanged
function decorate(root) {
  root.traverse(o => {
    if (!o.isMesh || !o.userData.holo || o.userData.real) return;
    o.userData.real = o.material; o.userData.holoMat = holoMaterial(o.userData.holo, o.userData.holoMap);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 28), edgeMaterial); e.userData.edges = true; e.raycast = () => {}; o.add(e);
  });
}
function applyLook(root = twin) { root.traverse(o => { if (o.userData.real) { o.material = S.holo ? o.userData.holoMat : o.userData.real; o.castShadow = !S.holo; } if (o.userData.edges) o.visible = S.holo; }); }

const S = { cases: [], i: -1, scan: null, I: null, holo: true, xray: false, explode: 0, explodeTo: 0, fly: null };
function setHolo(on) {
  S.holo = on; document.body.classList.toggle('holo', on); $('b-holo').setAttribute('aria-pressed', String(on));
  scene.background = new THREE.Color(on ? 0x04070b : 0x1d1d1f); realFloor.visible = !on; holoFloor.visible = on; key.castShadow = !on;
  renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = on ? 1.0 : 0.9;
  bloom.strength = on ? 0.75 : 0.45; bloom.threshold = on ? 0.2 : 1.05; bloom.radius = on ? 0.5 : 0.35;
  applyLook(); if (S.I) setInteriorLook(S.I, on);
}
function setXray(on) { S.xray = on; $('b-xray').setAttribute('aria-pressed', String(on)); if (S.I) setInteriorXray(S.I, on); frame(1.0); }
function setExplode(on) { S.explodeTo = on ? 1 : 0; $('b-explode').setAttribute('aria-pressed', String(on)); frame(1.1); }

function frame(dur = 1.2) {
  if (!S.scan) return;
  const box = S.I ? interiorBox(S.I, S.explodeTo) : new THREE.Box3().setFromObject(S.scan.group);
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  const dist = Math.max(90, r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.98);
  const phi = S.explodeTo ? 1.08 : 0.92, theta = 0.55;
  const to = c.clone().add(new THREE.Vector3(Math.sin(phi) * Math.sin(theta), Math.cos(phi), Math.sin(phi) * Math.cos(theta)).multiplyScalar(dist));
  S.fly = { t: 0, dur, p0: camera.position.clone(), t0: controls.target.clone(), p1: to, t1: c };
}

function show(i) {
  const k = S.cases[i]; if (!k) return;
  if (S.I) disposeInterior(S.I); if (S.scan) { twin.remove(S.scan.group); disposeScan(S.scan); }
  S.i = i;
  const photo = k.photo ? `data:image/jpeg;base64,${k.photo}` : '';
  S.scan = buildScan(k.scan, photo, k.crop); decorate(S.scan.group);
  for (const m of S.scan.meshes) m.userData.holoMat.uniforms.uMapAmt.value = 0.38;
  twin.add(S.scan.group);
  S.I = k.interior ? buildInterior(S.scan, k.scan, k.interior) : null;
  applyLook(); if (S.I) { setInteriorLook(S.I, S.holo); setInteriorXray(S.I, S.xray); explodeInterior(S.I, easeInOut(S.explode)); }
  const it = k.interior;
  $('name').textContent = it ? it.object : k.scan.name;
  $('guess').textContent = it ? `${it.model_guess || 'Model unknown'} · ${Math.round(it.confidence * 100)}% sure · ${it.layers.length} layers` : 'No interior';
  const ol = $('parts'); ol.replaceChildren();
  if (S.I) {
    let li = null, last = -1;
    for (const p of interiorItems(S.I)) {
      if (p.order !== last) { last = p.order; li = document.createElement('li'); const h = document.createElement('strong'); h.textContent = `${p.order + 1}. ${p.layer}`; li.append(h); ol.append(li); }
      const b = document.createElement('button'); b.type = 'button'; b.textContent = p.name;
      const on = () => { highlightInterior(S.I, p.mesh); tipFor(partInfo(p.mesh)); };
      b.addEventListener('focus', on); b.addEventListener('mouseenter', on);
      b.addEventListener('blur', () => { highlightInterior(S.I, null); tip(null); }); b.addEventListener('mouseleave', () => { highlightInterior(S.I, null); tip(null); });
      li.append(b);
    }
  }
  const src = $('src'); src.replaceChildren();
  if (it) {
    const head = document.createElement('div'); head.textContent = it.sources.length ? 'Sources' : 'From the model’s teardown knowledge (no web sources)'; src.append(head);
    for (const s of it.sources) { const a = document.createElement('a'); a.href = s.url; a.textContent = s.title || new URL(s.url).hostname; a.target = '_blank'; a.rel = 'noopener noreferrer'; const d = document.createElement('div'); d.append(a); src.append(d); }
    if (it.notes) { const n = document.createElement('div'); n.textContent = it.notes; n.style.marginTop = '6px'; src.append(n); }
  }
  frame(0.01);
}

function tip(info, x, y) {
  const t = $('tip'); if (!info) { t.hidden = true; return; }
  t.querySelector('strong').textContent = info.title; t.querySelector('span').textContent = info.body || ''; t.querySelector('em').textContent = info.said;
  t.style.left = `${Math.min(innerWidth - 280, x + 14)}px`; t.style.top = `${Math.max(8, y - 12)}px`; t.hidden = false;
}
function tipFor(info) { const p = info.pos.clone().project(camera); tip(info, (p.x + 1) / 2 * innerWidth, (1 - p.y) / 2 * innerHeight); }
const ray = new THREE.Raycaster();
canvas.addEventListener('pointermove', e => {
  if (!S.I) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const hit = pickInterior(S.I, ray); highlightInterior(S.I, hit?.mesh || null); tip(hit, e.clientX, e.clientY);
});
$('b-holo').onclick = () => setHolo(!S.holo); $('b-xray').onclick = () => setXray(!S.xray); $('b-explode').onclick = () => setExplode(S.explodeTo < 1);
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === 'h') setHolo(!S.holo); else if (k === 'x') setXray(!S.xray); else if (k === 'e') setExplode(S.explodeTo < 1); });

function resize() { renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); bloom.setSize(innerWidth / 2, innerHeight / 2); }
addEventListener('resize', resize); resize();
// the panel covers the left: shift the view's principal point right so the object centres in the free area
camera.setViewOffset(innerWidth, innerHeight, -160, 0, innerWidth, innerHeight);
let last = performance.now(), acc = 0, frames = 0; const stats = { fps: 0 };
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock.value += dt;
  if (S.explode !== S.explodeTo) { S.explode += Math.sign(S.explodeTo - S.explode) * Math.min(Math.abs(S.explodeTo - S.explode), dt / 0.9); if (S.I) explodeInterior(S.I, easeInOut(S.explode)); }
  if (S.fly) { const f = S.fly; f.t = Math.min(1, f.t + dt / f.dur); const e = easeInOut(f.t); camera.position.lerpVectors(f.p0, f.p1, e); controls.target.lerpVectors(f.t0, f.t1, e); if (f.t >= 1) S.fly = null; }
  controls.update(); scene.traverseVisible(o => o.userData.update?.());
  composer.render(dt); labels.render(scene, camera);
  acc += dt; frames++; if (acc >= 1) { stats.fps = frames / acc; acc = 0; frames = 0; }
}
setHolo(true);
S.cases = await (await fetch('/cases')).json();
const q = Number(new URLSearchParams(location.search).get('case') || 0);
show(Math.min(S.cases.length - 1, Math.max(0, q)));
camera.position.copy(S.fly?.p1 || new THREE.Vector3(0, 200, 300)); controls.target.copy(S.fly?.t1 || new THREE.Vector3()); S.fly = null;
requestAnimationFrame(loop);
window.interiorDemo = {
  cases: () => S.cases.map(c => c.scan.name), load: i => show(i), setLook: h => setHolo(!!h), setXray: on => setXray(!!on), setExplode: on => setExplode(!!on),
  state: () => ({ i: S.i, explode: S.explode, flying: !!S.fly, xray: S.xray, holo: S.holo, meshes: S.I?.meshes.length || 0, inside: !!S.I?.group.visible, fps: stats.fps,
    layers: S.I?.layers.map(l => ({ name: l.name, y: l.group.position.toArray() })) || [] }),
};
</script>
</body>
