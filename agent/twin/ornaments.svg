  <path d="M8 50H72L64 70H16Z" fill="#dfd3c7"/>
  <g fill="#8d5666"><rect x="14" y="54" width="6" height="6"/><rect x="26" y="54" width="6" height="6"/><rect x="38" y="54" width="6" height="6"/><rect x="50" y="54" width="6" height="6"/><rect x="62" y="54" width="4" height="6"/>
