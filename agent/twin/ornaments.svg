<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!-- Ody ornament sprite v2: drawn from scratch for Ody in the style of the HackUTA 2026 opening deck. No deck artwork is reused. -->
<defs>
  <pattern id="o-speckle" width="23" height="19" patternUnits="userSpaceOnUse">
    <g fill="#191a16"><circle cx="2" cy="3" r=".9"/><circle cx="9" cy="1.5" r=".6"/><circle cx="14" cy="6" r="1.1"/><circle cx="20" cy="2.5" r=".7"/>
    <circle cx="5" cy="10" r=".7"/><circle cx="11" cy="12" r="1"/><circle cx="18" cy="11" r=".6"/><circle cx="3" cy="16" r="1.1"/>
    <circle cx="8" cy="17.5" r=".6"/><circle cx="15" cy="16" r=".8"/><circle cx="21" cy="15" r="1"/><circle cx="12.5" cy="8.5" r=".5"/></g>
  </pattern>
</defs>
  <!-- four-point star (deck sparkle), fill = currentColor, usually --torch -->
  <symbol id="o-star" viewBox="0 0 24 24"><path d="M12 .5C12.9 7.6 16.4 11.1 23.5 12 16.4 12.9 12.9 16.4 12 23.5 11.1 16.4 7.6 12.9 .5 12 7.6 11.1 11.1 7.6 12 .5Z" fill="currentColor"/></symbol>
